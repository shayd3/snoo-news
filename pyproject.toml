[project]
name = "snoo-news"
version = "0.1.0"
description = "A small Pydantic AI agent that summarizes hot stories from news subreddits."
readme = "README.md"
authors = [
    { name = "shayd3" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-ai-slim[anthropic]>=1.87.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
snoo-news = "snoo_news.main:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
